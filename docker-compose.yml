# Spazio Comune: prenotazione di UN luogo comunale, descritto nel file .env (SPAZIO_*, COMUNE_*).
# Per più luoghi: una copia del repository (e un .env) per ciascuno.
#
#   docker compose up --build                       app + server di inferenza (backend "rules", offline) + server MCP
#   docker compose --profile test run --rm test     suite pytest
#   docker compose --profile llm up --build         + LLM locale con Ollama (modello piccolo, CPU)
#   docker compose --profile demo up --build -d     + istanza demo con dati fittizi su :8001
#
name: spazio-comune

x-database-url: &database-url postgresql://spazio:${POSTGRES_PASSWORD:-spazio-dev}@db:5432/spazio_comune

services:
  # --- database PostgreSQL: raggiungibile solo dalla rete interna di Compose
  db:
    container_name: spazio-comune-db
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: spazio_comune
      POSTGRES_USER: spazio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spazio-dev}
      TZ: Europe/Rome
    volumes: ["pgdati:/var/lib/postgresql/data"]
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spazio -d spazio_comune"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    container_name: spazio-comune-app
    build: ./app
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      INFERENCE_URL: http://inference:8080
      # PostgreSQL del container "db"; con un servizio gestito impostare DATABASE_URL nel .env
      DATABASE_URL: ${DATABASE_URL:-postgresql://spazio:${POSTGRES_PASSWORD:-spazio-dev}@db:5432/spazio_comune}
    depends_on:
      db:
        condition: service_healthy
      inference:
        condition: service_healthy
    restart: unless-stopped

  inference:
    container_name: spazio-comune-inference
    build: ./inference
    environment:
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-rules}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose: ["8080"]          # non pubblicato: raggiungibile solo dall'app
    restart: unless-stopped

  # --- server MCP: il luogo come strumento per altri agenti (usa solo le API HTTP dell'app)
  mcp:
    container_name: spazio-comune-mcp
    build: ./mcp_server
    ports: ["127.0.0.1:8090:8090"]     # http://localhost:8090/mcp, solo dalla macchina locale
    environment:
      SPAZIO_COMUNE_URL: http://app:8000
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
      # strumenti dell'ufficio (numeri di prenotazione): attivi solo se impostati nel .env
      SPAZIO_COMUNE_UFFICIO_USER: ${MCP_UFFICIO_USER:-}
      SPAZIO_COMUNE_UFFICIO_PASSWORD: ${MCP_UFFICIO_PASSWORD:-}
    depends_on: [app]
    restart: unless-stopped

  # --- LLM locale opzionale (nessun dato fuori dal server del Comune)
  ollama:
    container_name: spazio-comune-ollama
    image: ollama/ollama:0.12.11
    profiles: ["llm"]
    volumes: ["modelli:/root/.ollama"]
    expose: ["11434"]

  ollama-pull:
    container_name: spazio-comune-ollama-pull
    image: ollama/ollama:0.12.11
    profiles: ["llm"]
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "ollama:11434" }
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${LLM_MODEL:-qwen2.5:1.5b-instruct}"]
    restart: "no"

  # --- istanza dimostrativa: orologio fisso (lun 9/11/2026 18:35) e cittadini inventati
  demo:
    container_name: spazio-comune-demo
    build: ./app
    profiles: ["demo"]
    command: ["python", "scripts/demo.py"]
    ports: ["8001:8000"]
    env_file: [.env]                   # stesso luogo (SPAZIO_*, COMUNE_*); i valori sotto prevalgono
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      BASE_URL: http://localhost:8001
      DATABASE_URL: *database-url
      DATABASE_SCHEMA: demo                # schema a parte, ricreato a ogni avvio della demo
      INFERENCE_URL: http://inference:8080
      SECRET_KEY: demo-non-usare-in-produzione
      FEED_TOKEN: demo
      UFFICIO_USER: ufficio.sport          # credenziali fisse della demo
      UFFICIO_PASSWORD: cambiami
      CUSTODE_PASSWORD: custode
      COOKIE_SECURE: "false"
      DEMO_ORA: ${DEMO_ORA:-2026-11-09T18:35:00}
    depends_on:
      db:
        condition: service_healthy
      inference:
        condition: service_healthy

  # --- test
  test:
    container_name: spazio-comune-test
    build:
      context: .
      dockerfile: tests.Dockerfile
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: *database-url     # ogni test usa uno schema temporaneo, poi eliminato
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdati:
  modelli:
