description:
  it:
    shortDescription: Prenotazione degli spazi comunali con SPID/CIE, pagoPA, QR e assistente IA
    longDescription: >
      Applicazione web per la prenotazione degli impianti sportivi comunali. Il cittadino sceglie
      sport e orario su un calendario settimanale o descrivendo la richiesta in linguaggio naturale,
      accede con SPID o CIE, paga con pagoPA tramite l'intermediario regionale MyPay e riceve un
      QR code da mostrare al custode. L'ufficio gestisce riserve, pagamenti allo sportello ed export
      contabili senza cambiare il proprio modo di lavorare. Interfaccia Bootstrap Italia, conforme
      alle linee guida di design per i servizi digitali della PA. Include un server di inferenza
      OpenAI-compatibile con backend deterministico offline e supporto opzionale a LLM locali.
    features:
      - Calendario settimanale accessibile degli slot liberi
      - Assistente IA per la ricerca di orari e FAQ con fonti
      - Pagamento pagoPA contestuale alla prenotazione
      - QR code firmato per il controllo accessi
      - Back-office con export CSV e feed iCal
      - Server MCP per l'integrazione con assistenti e agenti
      - Configurazione del luogo tramite file .env, database PostgreSQL
    screenshots:
      - docs/screenshot/01_home.png
      - docs/screenshot/05_ticket.png
      - docs/screenshot/07_ufficio.png
